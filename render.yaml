# render.yaml
# ────────────
# Render.com deployment config.
# Push this file to GitHub → connect repo on render.com → auto deploys!

services:
  - type: web
    name: reelsnap-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true        # Render auto-generates a secure value
      - key: ALLOWED_ORIGINS
        value: "*"                 # Change to your Vercel URL after deploying frontend
      - key: RATE_LIMIT
        value: "10"
